<script>
(function(){
  var AC=window.AudioContext||window.webkitAudioContext,ac,out,bpm=58;
  var whispers=['hello','it’s still beating','can you hear it','behind you','it’s yours','hello'];
  function thump(t,f,g,d){
    var o=ac.createOscillator(),v=ac.createGain();
    o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.4,t+d);
    v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.02);v.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(v);v.connect(out);o.start(t);o.stop(t+d+.05);
  }
  function beat(){
    var t=ac.currentTime+.03,k=Math.min(bpm/60,1.8);
    thump(t,72,1,.24);
    thump(t+.27/k,58,.65,.22);
  }
  function nextBeat(){
    if(ac.state==='running'){
      beat();
      bpm+=1.3;
      if(bpm>118)bpm=44;
      if(Math.random()<.06)setTimeout(function(){if(ac.state==='running')beat();},180);
    }
    setTimeout(nextBeat,60000/bpm);
  }
  function breath(){
    if(ac.state==='running'){
      var len=ac.sampleRate*1.2,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
      for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
      var s=ac.createBufferSource();s.buffer=b;
      var f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=700+Math.random()*2500;f.Q.value=3;
      var g=ac.createGain(),t=ac.currentTime;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.5);g.gain.linearRampToValueAtTime(0,t+1.2);
      s.connect(f);f.connect(g);g.connect(out);s.start(t);
    }
    setTimeout(breath,4000+Math.random()*6000);
  }
  function whisper(){
    if(ac.state==='running'&&window.speechSynthesis){
      try{
        var u=new SpeechSynthesisUtterance(whispers[Math.random()*whispers.length|0]);
        u.pitch=.1;u.rate=.45;u.volume=.55;speechSynthesis.speak(u);
      }catch(e){}
    }
    setTimeout(whisper,11000+Math.random()*9000);
  }
  function init(){
    if(!AC)return;
    ac=new AC();
    var comp=ac.createDynamicsCompressor();comp.connect(ac.destination);
    out=ac.createGain();out.gain.value=.9;out.connect(comp);
    // dissonant drone: two detuned saws, slowly sweeping filter
    var lp=ac.createBiquadFilter(),dg=ac.createGain();
    lp.type='lowpass';lp.frequency.value=140;lp.Q.value=6;dg.gain.value=.07;
    [41,43.4].forEach(function(f){var o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start();});
    var lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.07;lg.gain.value=70;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
    lp.connect(dg);dg.connect(out);
    // thin eerie tone with wobble
    var e=ac.createOscillator(),eg=ac.createGain(),vib=ac.createOscillator(),vg=ac.createGain();
    e.type='sine';e.frequency.value=622;vib.frequency.value=5.5;vg.gain.value=9;vib.connect(vg);vg.connect(e.frequency);
    eg.gain.value=.012;e.connect(eg);eg.connect(out);e.start();vib.start();
    nextBeat();setTimeout(breath,3000);setTimeout(whisper,7000);
    // browsers need a touch before sound is allowed: resume on the first one
    var go=function(){
      if(ac.state!=='running')ac.resume();
      if(window.speechSynthesis)try{speechSynthesis.getVoices();}catch(e){}
    };
    ['pointerdown','touchstart','click','keydown'].forEach(function(n){addEventListener(n,go,{passive:true});});
    go();
  }
  init();
})();
</script>
